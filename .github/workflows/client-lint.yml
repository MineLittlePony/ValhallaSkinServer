name: client-lint

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install pnpm
      uses: pnpm/setup@v3
      with:
        working-directory: frontend
        cache: true

    - name: Lint app
      run: pnpm lint
      working-directory: frontend

    - name: Build app
      run: pnpm build
      working-directory: frontend
