[project]
name = "valhalla"
version = "2.0.0"
description = "An alternative skin server for Minecraft supporting metadata and hd textures"
license = "AGPL-3.0-only"
authors = [
    { name = "Matthew Messinger", email = "mattmess1221@gmail.com" },
]

requires-python = "==3.14.*"
dependencies = [
    "aiosqlite>=0.20.0",
    "authlib>=1.9.1",
    "boto3>=1.36.6",
    "httpx2>=2.9.1",
    "litestar[jwt,opentelemetry,pydantic,sqlalchemy,standard,valkey]>=2.25.0",
    "pathlib-abc>=0.5.2",
    "pillow>=11.1.0",
    "psycopg[binary]>=3.2.4",
    "pydantic-settings>=2.7.1",
]

[project.urls]
repository = "https://github.com/killjoy1221/ValhallaSkinServer"

[dependency-groups]
dev = [
    "pre-commit>=4.1.0",
]
lint = [
    "boto3-stubs[s3,sts]>=1.36.6",
    "ruff>=0.15.6",
    "ty>=0.0.64",
]
test = [
    "asgi-lifespan>=2.1.0",
    "freezegun>=1.5.5",
    "moto[s3,sts]>=5.0.27",
    "pytest>=8.3.4",
    "pytest-cov>=7.0.0",
    "pytest-httpx>=0.35.0",
    "pytest-sugar>=1.0.0",
    "tomlkit>=0.15.1",
]

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[tool.coverage]
[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "@overload",
    "class .*Protocol",
]
skip_covered = true
skip_empty = true

[tool.coverage.run]
branch = true
omit = [
    ".vscode*",
]

[tool.pytest]
addopts = ["-p", "valhalla.tests._pytest_plugin"]
filterwarnings = [
    "ignore:The declarative_mixin decorator was used:sqlalchemy.exc.SADeprecationWarning",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "B",
    "SIM",
    "I",
    "ANN",
    "UP",
    "YTT",
    "FBT",
    "ASYNC",
    "TID",
    "C4",
    "DTZ",
    "PIE",
    "RET",
    "SLF",
    "FLY",
    "PERF",
    "RUF",
    "ERA",
    "S",
    "BLE",
    "ISC",
    "ICN",
    "LOG",
    "G",
    "PT",
    "RSE",
    "SLOT",
    "ARG",
]

[tool.ruff.lint.per-file-ignores]
"valhalla/tests/*" = ["S101", "S105"]

[tool.tombi.format.rules]
indent-width = 4

[tool.uv]
default-groups = "all"
exclude-dependencies = ["httpx"]

[tool.uv.build-backend]
module-root = "."
