# Configuration for the skin server.
#
# Items can be set via config.toml or dotenv.

# Disable this setting to remove the requirement for users to sign into Minecraft before
# uploading their skins.
#
# It is similar to the online-mode setting in the Minecraft server.properties file.
#
# WARNING:
#     This setting is intended for development purposes. Setting it to false in production
#     is not supported or recommended.
#
# online_mode = true

# List of textures which will be denied upload.
#
# Valid values: ["skin", "cape", "elytra"]
#
# texture_type_denylist = ["cape"]

# The secret key used to sign the session data.
#
# If omitted, it will generate a new secret using the `secrets` module, then save
# it as a value in the file `.env`.
#
# Use the following command to create a new secret key.
#
# $ openssl rand -base64 24
#
# secret_key = ""

# The url to the database. Supports sqlite and postgresql.
#
# database_url = "postgresql://user:pass@host:5432/dbname"
# database_url = "sqlite:///./valhalla.db"

# URL pointing to a redis instance for the rate limiter
#
# redis_url = "redis://<host>:<port>/n"
# redis_url = ""

# URL pointing to the configured Sentry endpoint
#
# sentry_dsn = "https://<userid>.ingest.us.sentry.io/<appid>"
# sentry_dsn = ""

# The S3 bucket to store uploaded textures in.
#
# textures_bucket = ""

# The base path to where uploaded textures are stored.
#
# For S3, it behaves as a key prefix
#
# textures_path = "textures"

# The url to where the textures will be accessed on the client.
#
# For s3, will be https://{bucket-name}.s3.amazonaws.com/ or your configured domain alias.
#
# If empty, will assume same origin.
#
# textures_url = "https://foobar.s3.amazonaws.com"
# textures_url = ""

# xbox_live_client_id = ""

# xbox_live_client_secret = ""

# xbox_live_server_metadata_url = "https://login.live.com/.well-known/openid-configuration"

# xbox_live_client_kwargs = {scope = "XboxLive.signin offline_access"}

# aws_endpoint_url = ""

# aws_access_key_id = ""

# aws_secret_access_key = ""

# frontend_enabled = true

# frontend_dist_directory = "frontend/dist"
